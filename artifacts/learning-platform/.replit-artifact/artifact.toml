kind = "web"
previewPath = "/"
title = "AI Learning Platform"
description = "An AI-powered competency and learning platform for employees and training teams to assess skills, follow personalized learning paths, discover courses, and track measurable progress."
version = "1.0.0"
id = "artifacts/learning-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19688

[services.development]
run = "pnpm --filter @workspace/learning-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/learning-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/learning-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19688"
BASE_PATH = "/"
