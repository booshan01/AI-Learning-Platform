openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: learning
    description: Learner dashboard, courses, competencies, roadmap, and progress
  - name: ai
    description: AI learning coach
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /learning/dashboard:
    get:
      operationId: getLearningDashboard
      tags: [learning]
      summary: Get learner dashboard
      responses:
        "200":
          description: Learner overview and learning recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningDashboard"
  /learning/courses:
    get:
      operationId: listLearningCourses
      tags: [learning]
      summary: List available courses
      responses:
        "200":
          description: Courses and learner progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningCourse"
  /learning/competencies:
    get:
      operationId: listCompetencies
      tags: [learning]
      summary: List assessed competencies
      responses:
        "200":
          description: Competencies with current and target levels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competency"
  /learning/roadmap:
    get:
      operationId: getLearningRoadmap
      tags: [learning]
      summary: Get personalized learning roadmap
      responses:
        "200":
          description: Ordered learning path
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoadmapStep"
  /learning/activity:
    get:
      operationId: listLearningActivity
      tags: [learning]
      summary: List recent learning activity
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningActivity"
  /learning/settings:
    get:
      operationId: getLearningSettings
      tags: [learning]
      summary: Get learner learning preferences
      responses:
        "200":
          description: Saved study goal and coach style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSettings"
    patch:
      operationId: updateLearningSettings
      tags: [learning]
      summary: Update learner learning preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningSettingsUpdate"
      responses:
        "200":
          description: Updated study goal and coach style
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSettings"
        "400":
          description: Invalid learning preferences
  /learning/personal-profile:
    get:
      operationId: getLearningPersonalProfile
      tags: [learning]
      summary: Get the signed-in learner's encrypted personal profile
      responses:
        "200":
          description: Personal profile fields and proof-document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPersonalProfile"
    patch:
      operationId: updateLearningPersonalProfile
      tags: [learning]
      summary: Save the signed-in learner's encrypted personal profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningPersonalProfileUpdate"
      responses:
        "200":
          description: Saved personal profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningPersonalProfile"
        "400":
          description: Invalid personal profile data
        "503":
          description: Personal-data encryption is unavailable
    delete:
      operationId: deleteLearningPersonalProfile
      tags: [learning]
      summary: Delete the signed-in learner's personal profile and proof document
      responses:
        "204":
          description: Personal profile deleted
  /learning/personal-profile/address-proof/upload-url:
    post:
      operationId: requestAddressProofUpload
      tags: [learning]
      summary: Create a short-lived upload URL for a private proof-of-address file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressProofUploadInput"
      responses:
        "200":
          description: Short-lived upload URL and private object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressProofUpload"
        "400":
          description: Invalid file metadata
        "503":
          description: Private file storage is unavailable
  /learning/personal-profile/address-proof:
    get:
      operationId: downloadAddressProof
      tags: [learning]
      summary: Download the signed-in learner's private proof-of-address file
      responses:
        "200":
          description: Private proof-of-address file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No proof-of-address file is saved
  /learning/courses/{courseId}/progress:
    patch:
      operationId: updateCourseProgress
      tags: [learning]
      summary: Update progress for a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressUpdate"
      responses:
        "200":
          description: Updated course progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseProgress"
        "400":
          description: Invalid progress value
        "404":
          description: Course not found
  /gemini/learning-coach:
    post:
      operationId: askLearningCoach
      tags: [ai]
      summary: Ask the AI learning coach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningCoachInput"
      responses:
        "200":
          description: Coaching response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCoachReply"
        "400":
          description: Invalid request
        "429":
          description: Too many coaching requests
        "502":
          description: AI provider returned an error
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LearnerProfile:
      type: object
      required: [name, role, department, streakDays]
      properties:
        name: { type: string }
        role: { type: string }
        department: { type: string }
        streakDays: { type: integer }
    LearningStats:
      type: object
      required: [learningHours, completedCourses, inProgressCourses, readinessScore]
      properties:
        learningHours: { type: number }
        completedCourses: { type: integer }
        inProgressCourses: { type: integer }
        readinessScore: { type: integer }
    LearningCourse:
      type: object
      required: [id, title, category, description, instructor, durationHours, level, rating, userProgress, accent]
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        instructor: { type: string }
        durationHours: { type: number }
        level: { type: string }
        rating: { type: number }
        userProgress: { type: integer }
        accent: { type: string }
    Competency:
      type: object
      required: [id, name, category, currentLevel, targetLevel, impact]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        currentLevel: { type: integer }
        targetLevel: { type: integer }
        impact: { type: string }
    RoadmapStep:
      type: object
      required: [id, courseId, title, category, estimatedHours, status, position]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        title: { type: string }
        category: { type: string }
        estimatedHours: { type: number }
        status: { type: string }
        position: { type: integer }
    LearningActivity:
      type: object
      required: [id, title, detail, kind, occurredAt]
      properties:
        id: { type: integer }
        title: { type: string }
        detail: { type: string }
        kind: { type: string }
        occurredAt: { type: string, format: date-time }
    LearningDashboard:
      type: object
      required: [learner, stats, competencies, recommendedCourses, activity, weeklyHours]
      properties:
        learner: { $ref: "#/components/schemas/LearnerProfile" }
        stats: { $ref: "#/components/schemas/LearningStats" }
        competencies:
          type: array
          items: { $ref: "#/components/schemas/Competency" }
        recommendedCourses:
          type: array
          items: { $ref: "#/components/schemas/LearningCourse" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/LearningActivity" }
        weeklyHours:
          type: array
          items: { type: number }
    LearningSettings:
      type: object
      required: [weeklyStudyGoalHours, coachStyle]
      properties:
        weeklyStudyGoalHours: { type: integer, minimum: 1, maximum: 20 }
        coachStyle:
          type: string
          enum: [supportive, concise, challenging]
    LearningSettingsUpdate:
      type: object
      required: [weeklyStudyGoalHours, coachStyle]
      properties:
        weeklyStudyGoalHours: { type: integer, minimum: 1, maximum: 20 }
        coachStyle:
          type: string
          enum: [supportive, concise, challenging]
    LearningPersonalProfile:
      type: object
      required: [fullLegalName, dateOfBirth, placeOfBirth, genderSex, nationalityCitizenship, permanentAddress, currentResidentialAddress, maritalStatus, educationalQualifications, proofOfAddressDocument]
      properties:
        fullLegalName: { type: ["string", "null"], maxLength: 150 }
        dateOfBirth: { type: ["string", "null"], format: date }
        placeOfBirth: { type: ["string", "null"], maxLength: 150 }
        genderSex: { type: ["string", "null"], maxLength: 80 }
        nationalityCitizenship: { type: ["string", "null"], maxLength: 120 }
        permanentAddress: { type: ["string", "null"], maxLength: 2000 }
        currentResidentialAddress: { type: ["string", "null"], maxLength: 2000 }
        maritalStatus:
          type: ["string", "null"]
          enum: [single, married, separated, divorced, widowed, other, prefer_not_to_say, null]
        educationalQualifications: { type: ["string", "null"], maxLength: 2000 }
        proofOfAddressDocument:
          oneOf:
            - { $ref: "#/components/schemas/ProofOfAddressDocument" }
            - { type: "null" }
    LearningPersonalProfileUpdate:
      type: object
      required: [fullLegalName, dateOfBirth, placeOfBirth, genderSex, nationalityCitizenship, permanentAddress, currentResidentialAddress, maritalStatus, educationalQualifications]
      properties:
        fullLegalName: { type: ["string", "null"], maxLength: 150 }
        dateOfBirth: { type: ["string", "null"], format: date }
        placeOfBirth: { type: ["string", "null"], maxLength: 150 }
        genderSex: { type: ["string", "null"], maxLength: 80 }
        nationalityCitizenship: { type: ["string", "null"], maxLength: 120 }
        permanentAddress: { type: ["string", "null"], maxLength: 2000 }
        currentResidentialAddress: { type: ["string", "null"], maxLength: 2000 }
        maritalStatus:
          type: ["string", "null"]
          enum: [single, married, separated, divorced, widowed, other, prefer_not_to_say, null]
        educationalQualifications: { type: ["string", "null"], maxLength: 2000 }
        addressProofObjectPath: { type: ["string", "null"], maxLength: 500 }
        addressProofFileName: { type: string, maxLength: 160 }
    ProofOfAddressDocument:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName: { type: string, maxLength: 160 }
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
    AddressProofUploadInput:
      type: object
      required: [name, sizeBytes, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
    AddressProofUpload:
      type: object
      required: [uploadUrl, objectPath]
      properties:
        uploadUrl: { type: string, format: uri }
        objectPath: { type: string, maxLength: 500 }
    ProgressUpdate:
      type: object
      required: [percentComplete]
      properties:
        percentComplete: { type: integer, minimum: 0, maximum: 100 }
    CourseProgress:
      type: object
      required: [courseId, percentComplete]
      properties:
        courseId: { type: integer }
        percentComplete: { type: integer }
    LearningCoachInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 2, maxLength: 2000 }
        context: { type: string, maxLength: 4000 }
    LearningCoachReply:
      type: object
      required: [answer]
      properties:
        answer: { type: string }

